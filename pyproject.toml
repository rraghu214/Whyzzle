[project]
name = "whyzzle"
version = "0.1.0"
description = "AI-powered curiosity coach — turns any question into an instant visual explanation"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.50.0",
    "google-genai>=1.0.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "flask>=3.0.0",
    "mcp>=1.0.0",
    "python-dotenv>=1.0.0",
    "imageio-ffmpeg>=0.6.0",
    "prefab-ui>=0.19.1",
    "flask-cors>=6.0.2",
]


[tool.uv]
# This is a scripts project, not an installable library.
# uv manages the venv + deps; we run scripts directly with `uv run`.
package = false
